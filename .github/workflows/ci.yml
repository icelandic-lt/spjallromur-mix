name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Windows is deliberately excluded: the pipeline resolves local corpus
        # paths that are not Windows-compatible.
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install black

    - name: Check formatting with black
      run: |
        black --check .

    # No test suite exists yet; the runtime check is that every module imports
    # cleanly against the pinned dependency set.
    - name: Smoke test - imports resolve
      run: |
        python -c "import analyse; import synthesise; import align_manual_transcripts; import prepare_deposit"
